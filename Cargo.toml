[package]
name = "battguard"
version = "0.1.0"
edition = "2021"
description = "Utilitaire Windows pour prolonger l'autonomie et la duree de vie de la batterie"
license = "MIT"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
